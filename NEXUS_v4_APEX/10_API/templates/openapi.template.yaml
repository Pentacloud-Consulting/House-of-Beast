openapi: 3.1.0
info:
  title: "<project>"
  version: "v1"
servers:
  - url: /api/v1
paths:
  /<resource>:
    get:
      summary: "List <resource>"
      responses:
        "200": { description: "OK" }
        "429": { description: "Rate limited" }
components:
  schemas:
    EnvelopeSuccess:
      type: object
      properties:
        data: {}
        error: { type: "null" }
        meta: { type: object }
    EnvelopeError:
      type: object
      properties:
        data: { type: "null" }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

